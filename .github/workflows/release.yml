name: Native Linux packages and release
'on':
  push:
    tags:
    - v[0-9]*
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
      epoch: ${{ steps.meta.outputs.epoch }}
      matrix: ${{ steps.meta.outputs.matrix }}
    steps:
    - &id001
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
    - id: meta
      run: "set -euo pipefail\nversion=$(tr -d '\\n' < VERSION)\npublish=false\nif [[ \"$GITHUB_REF\" == refs/tags/v*\
        \ ]]; then\n  test \"$GITHUB_REF_NAME\" = \"v$version\"\n  publish=true\nfi\necho \"version=$version\" >>\
        \ \"$GITHUB_OUTPUT\"\necho \"publish=$publish\" >> \"$GITHUB_OUTPUT\"\necho \"epoch=$(git show -s --format=%ct\
        \ HEAD)\" >> \"$GITHUB_OUTPUT\"\necho \"matrix=$(python3 -c 'import json; print(json.dumps(json.load(open(\"\
        packaging/release-targets.json\")),separators=(\",\",\":\"))))')\" >> \"$GITHUB_OUTPUT\"\n"
  source-gate:
    needs: metadata
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
        - ubuntu-24.04
        - ubuntu-24.04-arm
    steps:
    - *id001
    - name: Install regression tools
      run: 'sudo apt-get update -qq

        sudo apt-get install -y -qq build-essential clang python3'
    - name: Full source regression and publication gate
      run: 'set -euo pipefail

        make clean

        make

        make check

        make test

        bash -n scripts/*.sh packaging/*.sh packaging/openrc/orchestra

        python3 scripts/check-doc-links.py

        scripts/security-scan.sh

        git diff --check'
  package:
    needs:
    - metadata
    - source-gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    steps:
    - *id001
    - name: Build and smoke-test native package
      env:
        IMAGE: ${{ matrix.image }}
        CONTAINER_ARCH: ${{ matrix.container_arch }}
        DISTRO: ${{ matrix.distro }}
        FAMILY: ${{ matrix.family }}
        FORMAT: ${{ matrix.format }}
        PACKAGE_ARCH: ${{ matrix.package_arch }}
        TARGET: ${{ matrix.name }}
        SOURCE_DATE_EPOCH: ${{ needs.metadata.outputs.epoch }}
        OUT_DIR: ${{ runner.temp }}/orchestra-${{ matrix.name }}
      run: 'set -uo pipefail

        mkdir -p "$OUT_DIR"

        docker run --rm --platform "linux/$CONTAINER_ARCH" --env DISTRO --env FAMILY --env FORMAT --env PACKAGE_ARCH
        --env SOURCE_DATE_EPOCH --env ORCHESTRA_PACKAGE_CONTAINER=1 --volume "$GITHUB_WORKSPACE:/src:ro" --volume
        "$OUT_DIR:/out" "$IMAGE" /bin/sh /src/packaging/ci-build-target.sh > "$OUT_DIR/$TARGET.log" 2>&1

        status=$?

        export BUILD_STATUS="$status"

        python3 - <<''PYRESULT''

        import json,os,subprocess

        from pathlib import Path

        record={k.lower():os.environ[k] for k in (''TARGET'',''DISTRO'',''IMAGE'',''FORMAT'',''PACKAGE_ARCH'',''BUILD_STATUS'')}

        record[''status'']=''PASS'' if record[''build_status'']==''0'' else ''FAIL''

        record[''source_commit'']=subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip()

        Path(os.environ[''OUT_DIR''],os.environ[''TARGET'']+''-result.json'').write_text(json.dumps(record,indent=2)+''\n'')

        PYRESULT

        cat "$OUT_DIR/$TARGET.log"

        exit "$status"

        '
    - name: Preserve package results and failures
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: orchestra-package-${{ matrix.name }}
        path: ${{ runner.temp }}/orchestra-${{ matrix.name }}/*
        if-no-files-found: error
        retention-days: 30
  aggregate:
    needs:
    - metadata
    - source-gate
    - package
    if: always() && needs.source-gate.result == 'success'
    runs-on: ubuntu-24.04
    steps:
    - *id001
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: orchestra-package-*
        path: dist
        merge-multiple: true
    - name: Assemble verified packages, source archives and results
      env:
        RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        SOURCE_DATE_EPOCH: ${{ needs.metadata.outputs.epoch }}
      run: 'set -euo pipefail

        ./scripts/source-tarball.sh "dist/orchestra-os-$RELEASE_VERSION-source.tar.gz"


        python3 packaging/aggregate-release.py dist

        (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS -print | LC_ALL=C sort | xargs sha256sum > SHA256SUMS)

        (cd dist && sha256sum -c SHA256SUMS)

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: orchestra-release-bundles
        path: dist
        if-no-files-found: error
        retention-days: 30
  publish:
    needs:
    - metadata
    - aggregate
    if: always() && needs.aggregate.result == 'success' && needs.metadata.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: public-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
    - *id001
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: orchestra-release-bundles
        path: dist
    - name: Verify every asset
      run: cd dist && sha256sum -c SHA256SUMS
    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-path: dist/*
    - name: Publish latest release
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\nversion=$(tr -d '\\n' < VERSION)\ntest \"$GITHUB_REF_NAME\" = \"v$version\"\ncp dist/PLATFORM_RESULTS.md\
        \ release-notes.md\ncat >> release-notes.md <<'EOF'\n\nIncludes native userspace tools and bridge, source\
        \ TAR/ZIP, SHA-256 checksums,\npackage-level SPDX SBOMs, logs, and GitHub build provenance. Installation\
        \ does\nnot enable sched_ext. Kernel artifacts require a target-matched build and are\nnot shipped. Package\
        \ smoke tests are not kernel runtime validation. Submitted\npaper evidence and historical negative results\
        \ remain available in docs/paper.\nEOF\ngh release create \"$GITHUB_REF_NAME\" dist/* --repo \"$GITHUB_REPOSITORY\"\
        \ --verify-tag --latest --title \"ORCHESTRA-OS $GITHUB_REF_NAME \u2014 Linux packages\" --notes-file release-notes.md\n"
