name: Target-matched ORCHESTRA sched_ext build

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: Exact source tree for the running kernel (must match uname -r)
        required: true
        type: string
      build_dir:
        description: External output directory on the self-hosted runner
        required: false
        default: /tmp/orchestra-os-ci-build
        type: string

# GitHub-hosted runners are deliberately not used here. The BPF object and
# libbpf adapter must be built against the exact target kernel, while verifier
# and attach evidence still belongs to the separate privileged validation gate.
jobs:
  build-sched-ext:
    runs-on: [self-hosted, linux, sched-ext]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check target capability
        run: ./scripts/check-system.sh --strict

      - name: Build target-matched kernel artifacts
        env:
          ORCHESTRA_KERNEL_SRC: ${{ inputs.kernel_source }}
          ORCHESTRA_BUILD_DIR: ${{ inputs.build_dir }}
        run: ./scripts/build.sh --kernel

      - name: Archive reproducibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orchestra-sched-ext-build-evidence
          path: |
            ${{ inputs.build_dir }}/build-manifest.txt
            ${{ inputs.build_dir }}/build.log
          if-no-files-found: error
          retention-days: 14
