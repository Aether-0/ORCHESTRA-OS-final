name: ORCHESTRA-OS non-privileged validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install portable build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang python3

      - name: Build and test
        run: |
          make clean
          make
          make check
          make test

      - name: Clang static analysis
        run: |
          set -euo pipefail
          common_flags=(
            --analyze
            -std=c11
            -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Wformat=2
            -Xanalyzer -analyzer-output=text
          )
          clang "${common_flags[@]}" \
            orchestra_paper_cpu_demo/orchestra_paper_cpu.c -o /dev/null
          clang "${common_flags[@]}" -Ikernel/sched_ext/include \
            kernel/sched_ext/bridge/orchestra_bridge.c -o /dev/null
          clang "${common_flags[@]}" \
            kernel/sched_ext/scripts/fixed_work.c -o /dev/null

      - name: Validate scripts and documentation
        run: |
          bash -n scripts/*.sh examples/*/*.sh
          bash -n packaging/*.sh packaging/openrc/orchestra
          python3 -m py_compile scripts/*.py
          python3 scripts/check-doc-links.py
          git diff --check

      - name: Scan tracked product content
        run: scripts/security-scan.sh

      - name: Capability report
        run: scripts/check-system.sh --json

      # GitHub-hosted runners are not a certified sched_ext target. This CI
      # job deliberately does not claim verifier, attach, ownership, action,
      # RT, unload, or soak validation.
